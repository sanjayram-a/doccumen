name: doccumen
description: "DocView Pro - Premium document viewer for Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  
  # File Handling
  file_picker: ^10.3.6
  open_file: ^3.5.10
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  
  # PDF Viewing
  pdfrx: ^2.2.12
  
  # Image Viewing
  photo_view: ^0.15.0
  
  # Database
  sqflite: ^2.4.1
  
  # Caching
  flutter_cache_manager: ^3.4.1
  
  # UI & Layout
  flutter_screenutil: ^5.9.3
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.1
  timeago: ^3.7.0
  path: ^1.9.1
  mime: ^2.0.0
  
  # Navigation
  go_router: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Code generation
  riverpod_generator: ^3.0.3
  build_runner: ^2.4.13
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
